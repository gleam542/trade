services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trade
      POSTGRES_PASSWORD: trade
      POSTGRES_DB: trade_signal
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade -d trade_signal"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://trade:trade@db:5432/trade_signal
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: .
    environment:
      DATABASE_URL: postgresql://trade:trade@db:5432/trade_signal
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "while true; do python main.py; sleep 900; done"]
    restart: unless-stopped

volumes:
  db-data:
